[package]
name = "starosta-game"
version = "0.1.0"
edition = "2021"

[dependencies]
bevy = { version = "0.13.0", features = ["bmp"] }
console_error_panic_hook = "0.1.7"
getrandom = { version = "0.3", features = ["wasm_js"] }
uuid = { version = "1.19.0", features = ["js"] }
wasm-bindgen = "0.2"
tracing = "0.1"
tracing-wasm = "0.2"

[lib]
crate-type = ["cdylib", "rlib"]
